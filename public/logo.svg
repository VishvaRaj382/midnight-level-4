<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Shield Glow -->
  <path d="M256 32 L448 112 V240 C448 356 366 444 256 480 C146 444 64 356 64 240 V112 Z" 
        fill="url(#glowGrad)" 
        stroke="url(#shieldGrad)" 
        stroke-width="12" 
        filter="url(#neonGlow)" />

  <!-- Inner Shield Core -->
  <path d="M256 64 L416 130 V240 C416 336 344 412 256 444 C168 412 96 336 96 240 V130 Z" 
        fill="#0b0f19" 
        stroke="#06b6d4" 
        stroke-width="6" />

  <!-- ZK Circuit Nodes -->
  <circle cx="256" cy="180" r="16" fill="#06b6d4" filter="url(#neonGlow)" />
  <circle cx="180" cy="270" r="12" fill="#3b82f6" />
  <circle cx="332" cy="270" r="12" fill="#a855f7" />
  <circle cx="256" cy="350" r="14" fill="#10b981" />

  <!-- Circuit Paths -->
  <path d="M256 196 V250 M256 250 L180 270 M256 250 L332 270 M180 270 V320 M332 270 V320 M180 320 L256 350 M332 320 L256 350" 
        stroke="url(#shieldGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" />

  <!-- Lock Icon Accent in Center -->
  <rect x="236" y="240" width="40" height="32" rx="6" fill="#06b6d4" />
  <path d="M244 240 V226 C244 218 250 212 256 212 C262 212 268 218 268 226 V240" 
        stroke="#22d3ee" 
        stroke-width="5" 
        fill="none" 
        stroke-linecap="round" />
</svg>
