<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Inner Core Gradient -->
    <linearGradient id="coreGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Circuit Pattern Stroke -->
    <linearGradient id="circuitLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow Layer -->
  <circle cx="256" cy="256" r="230" fill="url(#bgGlow)" />

  <!-- Outer Cyber Shield Frame -->
  <path 
    d="M256 48 L416 112 V240 C416 346 348 438 256 464 C164 438 96 346 96 240 V112 L256 48 Z" 
    fill="#0b0f19" 
    stroke="url(#shieldBorder)" 
    stroke-width="12" 
    stroke-linejoin="round"
  />

  <!-- Inner Inset Shield Outline -->
  <path 
    d="M256 78 L386 130 V236 C386 322 330 398 256 422 C182 398 126 322 126 236 V130 L256 78 Z" 
    fill="#111827" 
    stroke="url(#coreGradient)" 
    stroke-width="4" 
    stroke-opacity="0.6"
  />

  <!-- ZK Zero-Knowledge Lock Emblem Core -->
  <g transform="translate(176, 176)">
    <!-- Padlock Shackle -->
    <path 
      d="M44 80 V48 C44 26 62 8 80 8 C98 8 116 26 116 48 V80" 
      stroke="url(#shieldBorder)" 
      stroke-width="12" 
      stroke-linecap="round" 
      fill="none"
    />
    <!-- Padlock Body -->
    <rect 
      x="24" 
      y="76" 
      width="112" 
      height="80" 
      rx="16" 
      fill="url(#coreGradient)" 
      stroke="#67e8f9" 
      stroke-width="4"
    />
    <!-- Central Keyhole Glow -->
    <circle cx="80" cy="108" r="10" fill="#0b0f19" />
    <polygon points="76,112 84,112 86,130 74,130" fill="#0b0f19" />
  </g>

  <!-- Circuit Traces / Nodes -->
  <circle cx="256" cy="112" r="6" fill="#67e8f9" />
  <circle cx="160" cy="240" r="5" fill="#a855f7" />
  <circle cx="352" cy="240" r="5" fill="#a855f7" />
  <line x1="256" y1="118" x2="256" y2="176" stroke="url(#circuitLine)" stroke-width="3" stroke-dasharray="4,4" />
  <line x1="165" y1="240" x2="200" y2="240" stroke="url(#circuitLine)" stroke-width="3" />
  <line x1="347" y1="240" x2="312" y2="240" stroke="url(#circuitLine)" stroke-width="3" />
</svg>
